[package]
name = "eye-care-alarm"
version = "0.1.23"
description = "Cross-platform eye-care reminder living in the tray"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
parking_lot = "0.12"
sys-locale = "0.3"
rodio = { version = "0.21", default-features = false, features = [
    "playback",
    "wav",
    "flac",
    "vorbis",
    # symphonia-mp3 (default) decodes MPEG-2 24kHz files to silence; minimp3 handles them.
    "minimp3",
] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# Same version tao/wry pull in — feature-unified, no extra build cost.
# Used for NSWindow tweaks: overlay shield level above the menu bar, and
# hiding the panel's traffic-light buttons.
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSColor"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
