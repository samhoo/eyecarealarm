<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EyeCareAlarm · 护眼休息遮罩</title>
<style>
  :root{
    --bg:          oklch(0.965 0.002 250);
    --surface:     oklch(0.955 0.003 250);
    --fg:          oklch(0.23 0.008 250);
    --muted:       oklch(0.52 0.008 250);
    --border:      oklch(0.90 0.004 250);
    --accent:      oklch(0.66 0.13 172);
    --accent-deep: oklch(0.58 0.12 172);
    --ring:        oklch(0.45 0.09 172);
    --veil-fg:     oklch(0.96 0.002 250);
    --pill-bg:     rgba(12, 14, 18, 0.62);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: oklch(0.92 0.004 250);
    color: var(--fg);
    overflow: hidden;
  }
  .sr-only{
    position:absolute; width:1px; height:1px; margin:-1px;
    clip-path: inset(50%); overflow:hidden; white-space:nowrap;
  }

  /* ---------- 演示桌面背景 ---------- */
  .desktop{
    position: fixed; inset: 0;
    background: oklch(0.92 0.004 250);
    display: flex; align-items: center; justify-content: center;
  }
  .mock-window{
    width: min(620px, 78vw);
    background: oklch(0.99 0.001 250);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(20, 24, 32, 0.14);
    overflow: hidden;
  }
  .mock-titlebar{
    display: flex; align-items: center; gap: 6px;
    padding: 11px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .mock-titlebar i{
    width: 11px; height: 11px; border-radius: 50%;
    background: oklch(0.86 0.005 250);
    display: block;
  }
  .mock-titlebar span{
    flex: 1; text-align: center;
    font-size: 12px; color: var(--muted); letter-spacing: 0.02em;
  }
  .mock-body{ padding: 26px 30px 34px; }
  .mock-line{
    height: 10px; border-radius: 5px;
    background: oklch(0.90 0.004 250);
    margin-bottom: 14px;
  }
  .mock-line.w70{ width:70%; } .mock-line.w85{ width:85%; }
  .mock-line.w60{ width:60%; } .mock-line.w45{ width:45%; margin-bottom:0; }
  .mock-gap{ height: 12px; }

  /* ---------- 启动卡片 ---------- */
  .start-card{
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 10;
    width: min(400px, 90vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(20, 24, 32, 0.18);
    padding: 22px 22px 18px;
  }
  .start-card h1{
    font-size: 17px; font-weight: 600; letter-spacing: 0.01em;
    line-height: 1.4;
  }
  .readout{
    margin-top: 10px;
    font-size: 12.5px; color: var(--muted); line-height: 1.7;
    font-variant-numeric: tabular-nums;
  }
  .btn-primary{
    display: block; width: 100%; margin-top: 16px;
    min-height: 44px;
    border: none; border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .btn-primary:hover{ background: var(--accent-deep); }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-primary:focus-visible{ outline: 2px solid var(--ring); outline-offset: 2px; }
  .hint{
    margin-top: 12px;
    font-size: 12px; color: var(--muted); line-height: 1.7;
  }
  .status{
    margin-top: 10px;
    font-size: 12.5px; color: var(--fg); line-height: 1.6;
    min-height: 1.2em;
  }
  .open-settings{
    margin-top: 6px;
    font-size: 12.5px; color: var(--muted);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .open-settings:hover{ color: var(--fg); }
  .open-settings:focus-visible{ outline: 2px solid var(--ring); outline-offset: 2px; }

  /* ---------- 休息遮罩 ---------- */
  .veil{ position: fixed; inset: 0; z-index: 50; }
  .veil-dim{
    position: absolute; inset: 0;
    background: rgb(14, 16, 20);
    opacity: 1;
  }
  .veil-ui{ position: absolute; inset: 0; }

  .phase{
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    background: var(--pill-bg);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    color: var(--veil-fg);
    text-align: center;
    opacity: 0;
    max-width: min(640px, 88vw);
    padding: 20px 36px;
    font-size: 26px; font-weight: 550;
    line-height: 1.5; letter-spacing: 0.01em;
  }

  .exit-rest{
    position: absolute; right: 28px; bottom: 28px;
    min-height: 44px; min-width: 44px;
    padding: 0 20px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.30);
    background: rgba(12, 14, 18, 0.82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
    color: var(--veil-fg);
    font-size: 14px; font-weight: 550; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .exit-rest[hidden] { display: none; }
  .exit-rest:hover{
    background: rgba(34, 38, 46, 0.88);
    border-color: rgba(255, 255, 255, 0.5);
  }
  .exit-rest:active{ transform: translateY(1px); }
  .exit-rest:focus-visible{
    outline: 2px solid rgba(255, 255, 255, 0.9);
    outline-offset: 2px;
  }
  .exit-rest .cd{ display: inline-block; min-width: 2ch; text-align: center; }

  @media (max-width: 520px){
    .phase{ font-size: 20px; padding: 15px 24px; }
    .exit-rest{ right: 16px; bottom: 16px; }
  }
</style>
</head>
<body>

  <!-- 演示桌面 -->
  <div class="desktop" data-od-id="demo-backdrop" aria-hidden="true">
    <div class="mock-window" data-od-id="mock-window">
      <div class="mock-titlebar"><i></i><i></i><i></i><span>季度报告.txt</span></div>
      <div class="mock-body">
        <div class="mock-line w85"></div>
        <div class="mock-line w70"></div>
        <div class="mock-line w85"></div>
        <div class="mock-gap"></div>
        <div class="mock-line w60"></div>
        <div class="mock-line w85"></div>
        <div class="mock-line w45"></div>
      </div>
    </div>
  </div>

  <!-- 启动卡片 -->
  <main class="start-card" id="startScreen" data-od-id="start-screen">
    <h1>护眼休息遮罩 · 演示</h1>
    <p class="readout" id="settingsReadout" data-od-id="settings-readout"></p>
    <button class="btn-primary" id="startDemo" data-od-id="start-demo" type="button">开始演示</button>
    <p class="status" id="demoStatus" data-od-id="demo-status" role="status"></p>
    <p class="hint">桌面应用中遮罩由托盘程序自动触发；浏览器里需点击一次以解锁音频。</p>
    <a class="open-settings" id="openSettings" data-od-id="open-settings" href="eye-care-settings-panel.html">打开设置面板调整参数</a>
  </main>

  <!-- 休息遮罩 -->
  <div class="veil" id="restOverlay" data-od-id="rest-overlay" role="dialog" aria-modal="true" aria-label="护眼休息遮罩" hidden>
    <div class="veil-dim" id="veilDim"></div>
    <div class="veil-ui">
      <p class="phase" id="phaseWarm" data-od-id="phase-text-warmup">眼睛需要休息啦~</p>
      <p class="phase" id="phaseMain" data-od-id="phase-text-main">请看向至少 6 米（20 英尺）外远处物体 20 秒</p>
      <button class="exit-rest" id="exitRest" data-od-id="exit-rest" type="button">退出 (Esc) <span class="cd" id="cdNum">20</span>秒</button>
      <p class="sr-only" id="liveStatus" role="status"></p>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var KEY = 'eyeCareAlarm.settings.v1';
  var DEFAULTS = { overlay: 20, rest: 20, volume: 30, sound: '颂钵' };

  /* 时间线（秒）：0-5 预热遮罩 0%→目标透明度；文字一 0-2 渐显/4.5-5 渐隐；
     文字二 5-6 渐显后常驻；8s 起播放音效 rest 秒（末 2s 渐隐）；按设置时长结束 */
  var WARM_END = 5;
  var T1_IN_END = 2, T1_HOLD_END = 4.5, T1_OUT_END = 5;
  var T2_START = 5, T2_IN_END = 6, BLOCK_START = 8;
  var total = 0;

  function $(id){ return document.getElementById(id); }
  var veil = $('restOverlay'), dim = $('veilDim'),
      p1 = $('phaseWarm'), p2 = $('phaseMain'),
      exitBtn = $('exitRest'), cd = $('cdNum'), live = $('liveStatus'),
      startScreen = $('startScreen'), startBtn = $('startDemo'),
      readout = $('settingsReadout'), status = $('demoStatus');

  var running = false, rafId = 0, t0 = 0;
  var audioStarted = false, announced = 0, cfg = DEFAULTS;
  var actx = null, masterGain = null, audioStopTimer = 0;

  function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

  function readSettings(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ s = null; }
    s = s || {};
    return {
      overlay: clamp(Number(s.overlay != null ? s.overlay : DEFAULTS.overlay) || 0, 0, 100),
      rest:    clamp(Number(s.rest    != null ? s.rest    : DEFAULTS.rest)    || DEFAULTS.rest, 5, 60),
      volume:  clamp(Number(s.volume  != null ? s.volume  : DEFAULTS.volume)  || 0, 0, 100),
      sound:   (s.sound === '颂钵' || s.sound === '提示音' || s.sound === '无') ? s.sound : DEFAULTS.sound
    };
  }

  function refreshReadout(){
    var s = readSettings();
    readout.textContent = '当前设置 · 遮罩透明度 ' + s.overlay + '%（不透明度 ' + (100 - s.overlay) + '%）· 休息 ' + s.rest +
                          ' 秒 · 音量 ' + s.volume + '% · ' + s.sound;
  }

  /* ---------- 音频（WebAudio 合成，无外部文件） ---------- */
  function ensureCtx(){
    if (actx){ if (actx.state === 'suspended'){ actx.resume(); } return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      if (actx.state === 'suspended'){ actx.resume(); }
    } catch(e){ actx = null; }
  }

  function bowlStrike(dest, when){
    var partials = [[196, 0.55], [530, 0.30], [1049, 0.14]];
    for (var i = 0; i < partials.length; i++){
      var osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'sine'; osc.frequency.value = partials[i][0];
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(partials[i][1], when + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 4.5);
      osc.connect(g); g.connect(dest);
      osc.start(when); osc.stop(when + 4.6);
    }
  }

  function chime(dest, when){
    var notes = [[659.25, 0], [987.77, 0.4]];
    for (var i = 0; i < notes.length; i++){
      var osc = actx.createOscillator(), g = actx.createGain();
      var at = when + notes[i][1];
      osc.type = 'sine'; osc.frequency.value = notes[i][0];
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.5, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 1.8);
      osc.connect(g); g.connect(dest);
      osc.start(at); osc.stop(at + 1.9);
    }
  }

  function startAudio(s){
    if (s.sound === '无') return;
    ensureCtx();
    if (!actx) return;
    try {
      masterGain = actx.createGain();
      var v = clamp(s.volume, 0, 100) / 100 * 0.85;
      var dur = Math.max(1, s.rest);
      var t = actx.currentTime;
      masterGain.gain.setValueAtTime(v, t);
      masterGain.gain.setValueAtTime(v, t + Math.max(0, dur - 2));
      masterGain.gain.linearRampToValueAtTime(0.0001, t + dur); /* 末 2s 渐隐收尾 */
      masterGain.connect(actx.destination);
      var step = (s.sound === '颂钵') ? 5 : 6;
      for (var at = 0; at < dur - 0.5; at += step){
        if (s.sound === '颂钵'){ bowlStrike(masterGain, t + at); }
        else { chime(masterGain, t + at); }
      }
      audioStopTimer = setTimeout(stopAudio, (dur + 0.3) * 1000);
    } catch(e){ /* 无声环境下静默降级 */ }
  }

  function stopAudio(){
    if (audioStopTimer){ clearTimeout(audioStopTimer); audioStopTimer = 0; }
    if (!actx) return;
    try {
      var now = actx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.25);
      var c = actx;
      setTimeout(function(){ try { c.close(); } catch(e){} }, 350);
    } catch(e){}
    actx = null; masterGain = null;
  }

  /* ---------- 时间线 ---------- */
  function tick(now){
    if (!running) return;
    var t = (now - t0) / 1000;
    /* 面板值为「透明度」：100% = 全透明，缺省 20% → 遮罩不透明度 80% */
    var target = 1 - cfg.overlay / 100;

    dim.style.opacity = String(t < WARM_END ? target * (t / WARM_END) : target);

    var o1 = 0;
    var o2 = t < T2_START ? 0 : Math.min(1, (t - T2_START) / (T2_IN_END - T2_START));
    p2.style.opacity = String(clamp(o2, 0, 1));

    if (announced < 1){ live.textContent = '眼睛需要休息啦'; announced = 1; }
    if (announced < 2 && t >= T2_START){
      live.textContent = '请看向至少 6 米（20 英尺）外远处物体 ' + cfg.rest + ' 秒'; announced = 2;
    }

    if (!audioStarted && t >= BLOCK_START){ audioStarted = true; startAudio(cfg); }
    cd.textContent = String(Math.max(0, Math.ceil(total - t)));

    if (t >= total){ finish('auto'); return; }
    rafId = requestAnimationFrame(tick);
  }

  function startDemo(){
    cfg = readSettings();
    total = BLOCK_START + cfg.rest;
    p2.textContent = '请看向至少 6 米（20 英尺）外远处物体 ' + cfg.rest + ' 秒';
    running = true; audioStarted = false; announced = 0;
    status.textContent = '';
    startScreen.hidden = true;
    veil.hidden = false;
    dim.style.opacity = '0';
    p1.style.opacity = '0'; p2.style.opacity = '0';
    cd.textContent = String(cfg.rest);
    ensureCtx();
    exitBtn.focus();
    t0 = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function finish(reason){
    if (!running) return;
    running = false;
    cancelAnimationFrame(rafId);
    stopAudio();
    var elapsed = Math.round((performance.now() - t0) / 1000);
    veil.hidden = true;
    startScreen.hidden = false;
    status.textContent = (reason === 'auto')
      ? '本次休息已完成，遮罩已自动关闭。'
      : '已提前退出（演示进行了约 ' + elapsed + ' 秒）。';
    startBtn.textContent = '再次演示';
    refreshReadout();
    startBtn.focus();
  }

  /* ---------- 事件 ---------- */
  startBtn.addEventListener('click', startDemo);
  exitBtn.addEventListener('click', function(){ finish('manual'); });
  document.addEventListener('keydown', function(e){
    if (running && e.key === 'Escape'){ e.preventDefault(); finish('esc'); }
  });
  window.addEventListener('focus', refreshReadout);

  /* ---------- 初始化 ---------- */
  refreshReadout();
  if (location.hash === '#demo'){ startDemo(); }
})();
</script>
</body>
</html>
